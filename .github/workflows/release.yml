name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Compute version from tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"; V="${V#.}"
            echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keysbook.keystore
          else
            echo "No keystore secret set — release APK will be unsigned."
          fi

      - name: Verify the root source mirror is in sync
        run: |
          # The project is carried twice (app/ for Gradle, src/ for CodeAssist).
          # A drifted mirror silently ships old code to the on-device build.
          if ! diff -rq app/src/main src/main; then
            echo "ERROR: src/ is out of sync with app/src/main — copy it and commit."
            exit 1
          fi
          if ! diff -rq app/src/test src/test; then
            echo "ERROR: src/test is out of sync with app/src/test — copy it and commit."
            exit 1
          fi

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/keysbook-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/keysbook-release.apk
          else
            echo "WARNING: no signed release APK produced"
            ls app/build/outputs/apk/release/ || true
          fi
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.$(date +%Y%m%d%H%M)"
            TAG="v$VERSION"
          fi
          {
            echo "## KeysBook v$VERSION"
            echo
            echo "### Install — pick the file that matches the app you already have"
            echo "Both APKs are valid, but they are signed with **different keys**."
            echo "Android only lets an update install over an app with the SAME key, so:"
            echo "- **KeysBook-debug.apk** — key \`CN=Android Debug\` (SHA256 A9:E3:FE:09…)"
            echo "- **KeysBook-release.apk** — key \`CN=KeysBook\` (SHA256 98:AD:AD:A7…)"
            echo "- In the app, type \`/cert\` — it prints the key of the build you run, and therefore the file to download."
            echo "- If the installer says \"App not installed\" / INSTALL_FAILED_UPDATE_INCOMPATIBLE, you picked the other file. The failed install does not touch your data — just try the other one."
            echo "- Verify: \`sha256sum -c SHA256SUMS.txt\`"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "KeysBook v$VERSION" --notes-file release-notes.md
          fi
