name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup@v4
        with:
          gradle-version: wrapper

      - name: Decode Keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$KEYSTORE_FILE"
          fi
        shell: bash

      - name: Build with Gradle
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Prepare release artifacts
        id: prepare
        run: |
          apk_path=$(find . -name "*release*.apk" -type f | head -1)
          echo "apk_path=${apk_path}" >> $GITHUB_OUTPUT
          echo "version_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK to GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: keysbook-release-${{ github.ref_name }}
          path: ${{ steps.prepare.outputs.apk_path }}

      - name: Create Release
        id: release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Automated release for version ${{ github.ref_name }}.

      - name: Attach APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: ${{ steps.prepare.outputs.apk_path }}
          asset_name: keysbook-${{ github.ref_name }}.apk
          asset_content_type: application/vnd.android.package-archive
