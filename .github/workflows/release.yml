name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for this build (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Secrets are exposed as env vars because GitHub does not allow the
    # `secrets` context inside `if:` expressions.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure a Gradle wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            echo "No gradlew in repo; generating one for Gradle 8.13"
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x ./gradlew

      - name: Decode keystore (optional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "KEYSBOOK_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "KEYSBOOK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEYSBOOK_KEY_ALIAS=$KEY_ALIAS"
            echo "KEYSBOOK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Resolve version name
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            name="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="1.0-${GITHUB_SHA::7}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building version $name"

      - name: Build release APK
        run: ./gradlew :keysbook:assembleRelease -PversionName="${{ steps.version.outputs.name }}" --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp keysbook/build/outputs/apk/release/*.apk \
             "out/keysbook-${{ steps.version.outputs.name }}.apk"
          ls -l out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keysbook-release-${{ steps.version.outputs.name }}
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true