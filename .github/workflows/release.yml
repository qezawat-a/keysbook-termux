name: Build and Release APK

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_FILE: ${{ runner.temp }}/upload-key.keystore
        shell: bash
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            echo "$KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"
          fi

      - name: Build release APK
        working-directory: keysbook
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload-key.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Find release APK
        id: apk
        shell: bash
        run: |
          apk_path=$(find keysbook -type f -path '*/build/outputs/apk/release/*.apk' -print -quit)
          if [[ -z "$apk_path" ]]; then
            echo "No release APK was produced." >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: Automated release for version ${{ github.ref_name }}.
          files: ${{ steps.apk.outputs.path }}
