name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: instabox-medium
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup@v4
        with:
          gradle-version: 8.10

      - name: Decode Keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_FILE: ${{ runner.temp }}/upload-key.keystore
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$KEYSTORE_FILE"
          fi
        shell: bash

      - name: Build with Gradle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload-key.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare release artifacts
        id: prepare
        run: |
          apk_path=$(find . -name "*release*.apk" -type f | head -1)
          echo "apk_path=${apk_path}" >> $GITHUB_OUTPUT
          echo "version_name=${github_ref_name}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Automated release for version ${{ github.ref_name }}.
          files: |
            ${{ steps.prepare.outputs.apk_path }}
          file_glob: true
